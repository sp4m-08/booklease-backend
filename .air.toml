root = "."
tmp_dir = "tmp"

[build]
  bin = ".\\main_dev.exe"
  cmd = "go build -o ./main_dev.exe ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", ".agents", "static", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  full_bin = ".\\main_dev.exe"
  include_ext = ["go", "env"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true
