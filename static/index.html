<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>BookLease — Firebase Login & Token Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    button {
      cursor: pointer;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f8f9fa;
      transition: all 0.2s;
    }
    button:hover { background: #e9ecef; }
    #login {
      background: #4285f4;
      color: white;
      border-color: #4285f4;
    }
    #login:hover { background: #3367d6; }
    #tokenContainer {
      margin-top: 20px;
      display: none;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-top: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #f8f9fa;
      box-sizing: border-box;
    }
    .status {
      margin-top: 15px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <h2>📚 BookLease Authentication & API Tester</h2>
  <button id="login">Sign in with Google</button>

  <p id="output" class="status"></p>

  <div id="tokenContainer">
    <label for="tokenBox"><strong>Firebase ID Token (for Postman / API testing):</strong></label>
    <textarea id="tokenBox" readonly></textarea>
    <div style="margin-top: 8px;">
      <button id="copyBtn">📋 Copy Token to Clipboard</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhkwpAm5m9dMDGzMlA-DkOxvUY_a60Zts",
      authDomain: "bookrental-t.firebaseapp.com",
      projectId: "bookrental-t",
      storageBucket: "bookrental-t.firebasestorage.app",
      messagingSenderId: "13147389735",
      appId: "1:13147389735:web:8be287896188e7a9c77302",
      measurementId: "G-ZTC5KYVMP0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.auth = auth; // Expose globally for console access
    const provider = new GoogleAuthProvider();

    // Optional: restrict to a specific org domain
    provider.setCustomParameters({
      prompt: "select_account",
      hd: "vitstudent.ac.in"
    });

    document.getElementById("login").onclick = () => {
      document.getElementById("output").innerText = "Signing in...";
      signInWithPopup(auth, provider)
        .then(result => result.user.getIdToken())
        .then(token => {
          // 1. Log directly to Console
          console.log("=========================================");
          console.log("🔥 YOUR FIREBASE ID TOKEN:");
          console.log(token);
          console.log("=========================================");

          // 2. Display on the web page with copy button
          document.getElementById("tokenBox").value = token;
          document.getElementById("tokenContainer").style.display = "block";

          // 3. Test backend authentication endpoint
          return fetch("/api/hello", {
            method: "GET",
            headers: {
              Authorization: `Bearer ${token}`
            }
          });
        })
        .then(res => res.text())
        .then(msg => {
          document.getElementById("output").innerText = msg;
        })
        .catch(error => {
          console.error("Error:", error);
          document.getElementById("output").innerText = "Login failed: " + error.message;
        });
    };

    document.getElementById("copyBtn").onclick = () => {
      const box = document.getElementById("tokenBox");
      box.select();
      navigator.clipboard.writeText(box.value).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerText = "✅ Copied to Clipboard!";
        setTimeout(() => { copyBtn.innerText = "📋 Copy Token to Clipboard"; }, 2000);
      });
    };
  </script>
</body>

</html>
